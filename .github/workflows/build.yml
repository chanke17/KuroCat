name: Build KuroCat (macOS, Windows & Linux/UOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build standalone KuroCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          dir KuroCat.exe

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Windows-x64
          path: windows/KuroCat.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check coat artwork and native action regressions
        run: bash scripts/check-skins.sh

      - name: Check covered eye pixels
        run: bash scripts/check-eye-closure.sh

      - name: Build Universal KuroCat.app (Apple Silicon + Intel)
        run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent KuroCat.app KuroCat-macOS-universal.zip
          ls -lh KuroCat-macOS-universal.zip

      - name: Upload macOS universal app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-macOS-universal
          path: KuroCat-macOS-universal.zip

  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            tar_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: arm64
    runs-on: ${{ matrix.runner }}
    # Build inside Ubuntu 22.04 LTS (glibc 2.35) for wide compatibility across
    # Ubuntu 22.04+/24.04, Debian 12+, Deepin, UnionTech UOS V23, Kylin, Arch & Fedora!
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libxi-dev dpkg-dev ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KuroCat Linux binary & .deb (UOS/Debian/Ubuntu)
        shell: bash
        run: |
          chmod +x linux/build.sh linux/build_deb.sh
          cd linux
          ./build.sh
          DEB_VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$DEB_VER" =~ ^[0-9]+\.[0-9]+ ]]; then DEB_VER="1.2.0"; fi
          ./build_deb.sh "$DEB_VER"
          tar -czf "KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz" kurocat kurocat.desktop kurocat.svg
          ls -lh "KuroCat-Linux-${{ matrix.arch }}.deb" "KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Linux-${{ matrix.arch }}
          path: |
            linux/KuroCat-Linux-${{ matrix.arch }}.deb
            linux/KuroCat-Linux-${{ matrix.tar_arch }}.tar.gz

  release:
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename Windows binary
        run: mv dist/KuroCat.exe dist/KuroCat-Windows-x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KuroCat-macOS-universal.zip
            dist/KuroCat-Windows-x64.exe
            dist/KuroCat-Linux-amd64.deb
            dist/KuroCat-Linux-x86_64.tar.gz
            dist/KuroCat-Linux-arm64.deb
            dist/KuroCat-Linux-arm64.tar.gz
